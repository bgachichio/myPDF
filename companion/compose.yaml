# myPDF companion with Gotenberg (LibreOffice in a container). Needs about 1.5 GB free memory while converting.
# Start:  MYPDF_COMPANION_TOKEN=$(openssl rand -base64 24 | tr '+/' '-_' | tr -d '=') docker compose up
# Stop:   docker compose down
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: "no"
    expose: ["3000"]
    mem_limit: 1800m
  gateway:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "gateway.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      GOTENBERG_URL: http://gotenberg:3000
      MYPDF_COMPANION_TOKEN: ${MYPDF_COMPANION_TOKEN:?set a pairing token}
    volumes: ["./gateway.mjs:/app/gateway.mjs:ro"]
    ports: ["127.0.0.1:8787:8787"]
    depends_on: [gotenberg]
