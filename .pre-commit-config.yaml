# Commit gate (builder section 7.1 item 6). Diff against aiOS builder assets/pre-commit-config.yaml
# before the first commit; that file was not mounted when this packet was written.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks: [ { id: gitleaks } ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: ^public/tesseract/
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: no-em-dash
        name: no em dashes in UI copy
        entry: "—"
        language: pygrep
        files: ^src/
