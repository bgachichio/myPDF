# Commit gate (builder §7.1 item 6). Pre-commit checks always run; the app steps switch on
# automatically once package-lock.json exists (M0 scaffold), so the gate is green before then.
name: gate
on: [push, pull_request]
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      - name: Pre-commit (secrets, keys, large files, em dashes)
        run: pip install "pre-commit==4.6.2" && pre-commit run --all-files
      - name: Detect app
        id: app
        run: |
          if [ -f package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No package-lock.json yet; app steps skipped until the M0 scaffold."; fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.app.outputs.present == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm audit --audit-level=high
      - if: steps.app.outputs.present == 'true'
        run: npx oxlint && npx eslint . && npx tsc --noEmit
      - if: steps.app.outputs.present == 'true'
        run: npm test
      - if: steps.app.outputs.present == 'true'
        run: npm run build
      - if: steps.app.outputs.present == 'true' && hashFiles('scripts/corpus-check.mjs') != ''
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils unzip && node scripts/corpus-check.mjs # poppler's pdfsig and unzip are the independent checkers for F19 and F22

  # End-to-end tests run per browser in parallel, each with its own cap: the three-browser suite in one job outran its 20 minutes (2026-10-23).
  # `perf` depends on `main`, so --project=perf runs the Chromium suite and then the long-task measurement.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: perf, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
