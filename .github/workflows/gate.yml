# Commit gate (builder §7.1 item 6). Pre-commit checks always run; the app steps switch on
# automatically once package-lock.json exists (M0 scaffold), so the gate is green before then.
name: gate
on: [push, pull_request]
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Pre-commit (secrets, keys, large files, em dashes)
        run: pip install pre-commit && pre-commit run --all-files
      - name: Detect app
        id: app
        run: |
          if [ -f package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No package-lock.json yet; app steps skipped until the M0 scaffold."; fi
      - uses: actions/setup-node@v5
        if: steps.app.outputs.present == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm audit --audit-level=high
      - if: steps.app.outputs.present == 'true'
        run: npx oxlint && npx eslint . && npx tsc --noEmit
      - if: steps.app.outputs.present == 'true'
        run: npm test
      - if: steps.app.outputs.present == 'true'
        run: npm run build
      - if: steps.app.outputs.present == 'true' && hashFiles('scripts/corpus-check.mjs') != ''
        run: sudo apt-get install -y qpdf && node scripts/corpus-check.mjs
      - if: steps.app.outputs.present == 'true' && hashFiles('playwright.config.*') != ''
        run: sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui && npx playwright install --with-deps chromium firefox webkit && npx playwright test
